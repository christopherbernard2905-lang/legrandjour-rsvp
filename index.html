// Ajoute l'email et l'identifiant du compte au lien Stripe : l'email est pré-rempli au paiement,
// et l'identifiant (client_reference_id) apparaît dans Stripe pour savoir quel compte activer.
function payLink(base, user) {
  if (!base) return "";
  const sep = base.includes("?") ? "&" : "?";
  return base + sep + "prefilled_email=" + encodeURIComponent(user.email || "") + "&client_reference_id=" + encodeURIComponent(user.id);
}

function PlanCard({ highlight, name, price, priceNote, features, href, cta }) {
  return (
    <div style={{ flex: "1 1 220px", display: "flex", flexDirection: "column", background: colors.card, border: `${highlight ? 2 : 1}px solid ${highlight ? colors.gold : colors.border}`, borderRadius: 3, padding: "22px 20px", position: "relative" }}>
      {highlight && (
        <span style={{ position: "absolute", top: -11, left: 20, background: colors.gold, color: "#FFFDF9", fontFamily: bodyFont, fontSize: 11, letterSpacing: "0.04em", padding: "2px 10px", borderRadius: 2 }}>
          Pour les organisateurs réguliers
        </span>
      )}
      <p style={{ fontFamily: serif, fontSize: 21, color: colors.navy, margin: "0 0 4px 0" }}>{name}</p>
      <p style={{ fontFamily: serif, fontSize: 34, color: colors.navy, margin: 0, lineHeight: 1.1 }}>{price}</p>
      <p style={{ fontFamily: bodyFont, fontSize: 13, color: colors.muted, margin: "2px 0 14px 0" }}>{priceNote}</p>
      <ul style={{ listStyle: "none", padding: 0, margin: "0 0 18px 0", flex: 1 }}>
        {features.map((f) => (
          <li key={f} style={{ fontFamily: bodyFont, fontSize: 14, color: colors.text, marginBottom: 6, paddingLeft: 18, position: "relative" }}>
            <span style={{ position: "absolute", left: 0, color: colors.gold }}>✓</span>{f}
          </li>
        ))}
      </ul>
      {href ? (
        <a
          href={href}
          target="_blank"
          rel="noopener noreferrer"
          className={highlight ? "btn-primary" : "btn-ghost"}
          style={{ display: "block", textAlign: "center", textDecoration: "none", fontFamily: bodyFont, fontSize: 16, padding: "11px 16px", borderRadius: 2, border: `1px solid ${highlight ? colors.navy : colors.borderStrong}`, background: highlight ? colors.navy : "transparent", color: highlight ? "#FAF6F0" : colors.navy }}
        >
          {cta}
        </a>
      ) : (
        <span style={{ fontFamily: bodyFont, fontSize: 13, color: colors.muted, fontStyle: "italic", textAlign: "center" }}>Paiement bientôt disponible</span>
      )}
    </div>
  );
}

function UpgradeModal({ quota, user, onClose }) {
  useEffect(() => {
    const onKey = (e) => { if (e.key === "Escape") onClose(); };
    window.addEventListener("keydown", onKey);
    return () => window.removeEventListener("keydown", onKey);
  }, [onClose]);

  return (
    <div
      onClick={onClose}
      style={{ position: "fixed", inset: 0, background: "rgba(31,42,68,0.55)", display: "flex", alignItems: "center", justifyContent: "center", padding: 16, zIndex: 1000 }}
    >
      <div
        role="dialog"
        aria-modal="true"
        aria-labelledby="upgrade-title"
        onClick={(e) => e.stopPropagation()}
        className="fade-in"
        style={{ width: "100%", maxWidth: 620, maxHeight: "92vh", overflowY: "auto", background: colors.bg, border: `1px solid ${colors.gold}`, boxShadow: "0 24px 60px rgba(31,42,68,0.35)", padding: "32px 28px 24px", position: "relative" }}
      >
        <button
          onClick={onClose}
          aria-label="Fermer"
          style={{ position: "absolute", top: 10, right: 14, background: "none", border: "none", fontSize: 22, lineHeight: 1, color: colors.muted, cursor: "pointer" }}
        >
          ×
        </button>
        <h2 id="upgrade-title" style={{ fontFamily: serif, fontSize: 28, color: colors.navy, margin: "0 0 8px 0", textAlign: "center" }}>
          Débloquez un nouvel événement
        </h2>
        <p style={{ fontFamily: bodyFont, fontSize: 15, color: colors.text, textAlign: "center", margin: "0 auto 24px", maxWidth: 460 }}>
          Votre offre gratuite inclut {quota.allowed} événement{quota.allowed > 1 ? "s" : ""}, et {quota.allowed > 1 ? "ils sont tous utilisés" : "il est déjà utilisé"}
          {" "}(un événement supprimé reste décompté). Choisissez une formule pour continuer.
        </p>
        <div style={{ display: "flex", gap: 16, flexWrap: "wrap", marginTop: 8 }}>
          <PlanCard
            name="Pass Événement"
            price="29 €"
            priceNote="paiement unique"
            features={["1 événement supplémentaire", "RSVP, plan de table et menus", "Export CSV de la liste"]}
            href={payLink(STRIPE_EVENT_PASS_LINK, user)}
            cta="Acheter le Pass"
          />
          <PlanCard
            highlight
            name="Abonnement Organisateur"
            price="49 €"
            priceNote="par mois, résiliable à tout moment"
            features={["Événements illimités", "Mariages, anniversaires, fêtes, pro", "Tout ce qu'inclut le Pass, pour chaque événement"]}
            href={payLink(STRIPE_SUBSCRIPTION_LINK, user)}
            cta="S'abonner"
          />
        </div>
        <p style={{ fontFamily: bodyFont, fontSize: 12, color: colors.muted, textAlign: "center", margin: "20px 0 4px" }}>
          Paiement sécurisé par Stripe. Utilisez la même adresse e-mail que votre compte ({user.email}) : votre accès est activé après réception du paiement.
        </p>
        <div style={{ textAlign: "center", marginTop: 8 }}>
          <button onClick={onClose} style={{ fontFamily: bodyFont, fontSize: 13, color: colors.muted, background: "none", border: "none", textDecoration: "underline", cursor: "pointer" }}>
            Plus tard
          </button>
        </div>
      </div>
    </div>
  );
}

function OrganizerHome({ user, onLogout }) {
  const [weddings, setWeddings] = useState([]);
  const [loading, setLoading] = useState(true);
  const [selectedId, setSelectedId] = useState(null);
  const [error, setError] = useState("");
  const [creating, setCreating] = useState(false);
  const [quota, setQuota] = useState({ plan: "free", created: 0, allowed: FREE_PLAN_EVENT_LIMIT });
  const [showUpgrade, setShowUpgrade] = useState(false);

  const refresh = useCallback(async () => {
    setLoading(true);
    const { data: owned } = await sb.from("weddings").select("*").eq("organizer_id", user.id).order("created_at", { ascending: false });
    let collabWeddings = [];
    if (user.email) {
      const { data: collabRows } = await sb.from("wedding_collaborators").select("wedding_id").eq("email", user.email);
      const ids = (collabRows || []).map((r) => r.wedding_id);
      if (ids.length > 0) {
        const { data: cw } = await sb.from("weddings").select("*").in("id", ids);
        collabWeddings = cw || [];
      }
    }
    const merged = [...(owned || [])];
    collabWeddings.forEach((w) => { if (!merged.some((m) => m.id === w.id)) merged.push(w); });
    setWeddings(merged);
    const { data: planRow } = await sb.from("organizer_plans").select("plan, events_created, events_allowed").eq("organizer_id", user.id).maybeSingle();
    setQuota({
      plan: (planRow && planRow.plan) || "free",
      created: (planRow && planRow.events_created) || 0,
      allowed: (planRow && planRow.events_allowed) || FREE_PLAN_EVENT_LIMIT,
    });
    setLoading(false);
  }, [user.id, user.email]);

  useEffect(() => { refresh(); }, [refresh]);

  const atLimit = quota.plan !== "subscription" && quota.created >= quota.allowed;

  const createWedding = async () => {
    if (atLimit) { setShowUpgrade(true); return; }
    setCreating(true); setError("");
    const { data, error } = await sb.from("weddings").insert({ organizer_id: user.id }).select().single();
    if (error) {
      if ((error.message || "").includes("event_limit_reached")) { setShowUpgrade(true); refresh(); }
      else setError("Impossible de créer un nouvel événement (" + error.message + ").");
      setCreating(false);
      return;
    }
    setCreating(false);
    setSelectedId(data.id);
  };

  const deleteWedding = async (id, e) => {
    e.stopPropagation();
    if (!window.confirm("Supprimer définitivement cet événement et toutes ses données (invités, réponses, tables) ? Cette action est IRRÉVERSIBLE — pensez à exporter en CSV depuis le tableau de bord avant si besoin.")) return;
    await sb.from("weddings").delete().eq("id", id);
    refresh();
  };

  if (selectedId) {
    return <AdminDashboard weddingId={selectedId} currentUser={user} onLogout={onLogout} onBack={() => { setSelectedId(null); refresh(); }} />;
  }

  return (
    <div style={{ maxWidth: 700, margin: "0 auto" }}>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 4 }}>
        <h1 style={{ fontFamily: serif, fontSize: 30, color: colors.navy, margin: 0 }}>Mes événements</h1>
        <button onClick={onLogout} style={{ fontFamily: bodyFont, fontSize: 13, color: colors.muted, background: "none", border: "none", textDecoration: "underline", cursor: "pointer" }}>Se déconnecter</button>
      </div>
      <p style={{ fontFamily: bodyFont, fontSize: 12, letterSpacing: "0.05em", color: colors.gold, marginBottom: 20 }}>
        {quota.plan === "subscription" ? "Abonnement Organisateur" : quota.allowed > FREE_PLAN_EVENT_LIMIT ? "Pass Événement" : "Offre gratuite"}
      </p>

      {showUpgrade && <UpgradeModal quota={quota} user={user} onClose={() => setShowUpgrade(false)} />}

      <div style={{ marginBottom: 20 }}>
        <Button onClick={createWedding} disabled={creating}>{creating ? "Création…" : "+ Nouvel événement"}</Button>
      </div>
      <ErrorText>{error}</ErrorText>

      {loading ? (
        <p style={{ fontFamily: bodyFont, color: colors.text }}>Chargement…</p>
      ) : weddings.length === 0 ? (
        <p style={{ fontFamily: bodyFont, color: colors.muted, fontStyle: "italic" }}>Aucun événement pour le moment — créez-en un pour commencer.</p>
      ) : (
        <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fill, minmax(220px, 1fr))", gap: 14 }}>
          {weddings.map((w) => (
            <div
              key={w.id}
              className="card-hover fade-in"
              onClick={() => setSelectedId(w.id)}
              style={{ background: colors.card, border: `1px solid ${colors.border}`, borderRadius: 3, padding: 20, cursor: "pointer", position: "relative", boxShadow: "0 2px 10px rgba(31,42,68,0.05)" }}
            >
              <p style={{ fontFamily: bodyFont, fontSize: 11, letterSpacing: "0.05em", color: colors.gold, marginBottom: 4 }}>{eventTypeInfo(w.event_type).label}</p>
              <p style={{ fontFamily: serif, fontSize: 22, color: colors.navy, margin: 0 }}>{w.couple_names || "Événement sans nom"}</p>
              <p style={{ fontFamily: bodyFont, fontSize: 13, color: colors.muted, marginTop: 6 }}>{w.wedding_date || "Date non renseignée"}</p>
              <button
                onClick={(e) => deleteWedding(w.id, e)}
                style={{ position: "absolute", top: 10, right: 10, background: "none", border: "none", color: colors.danger, fontSize: 12, cursor: "pointer", textDecoration: "underline" }}
              >
                Supprimer
              </button>
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

function App() {
  const params = new URLSearchParams(window.location.search);
  const weddingId = params.get("w");
  const [session, setSession] = useState(undefined);

  useEffect(() => {
    if (weddingId) return;
    sb.auth.getSession().then(({ data }) => setSession(data.session));
    const { data: listener } = sb.auth.onAuthStateChange((_event, sess) => setSession(sess));
    return () => listener.subscription.unsubscribe();
  }, [weddingId]);

  return (
    <div style={{ minHeight: "100vh", background: colors.bg, padding: "40px 16px" }}>
      {weddingId ? (
        <GuestView weddingId={weddingId} />
      ) : session === undefined ? (
        <p style={{ fontFamily: bodyFont, textAlign: "center", color: colors.text }}>Chargement…</p>
      ) : session ? (
        <OrganizerHome user={session.user} onLogout={() => sb.auth.signOut()} />
      ) : (
        <AuthView onLoggedIn={() => {}} />
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
