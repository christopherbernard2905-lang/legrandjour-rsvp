const EVENT_TYPES = [
  { value: "mariage", label: "Mariage", eyebrow: "Vous êtes invité(e)" },
  { value: "anniversaire", label: "Anniversaire", eyebrow: "C'est une fête !" },

];
function eventTypeInfo(v) { return EVENT_TYPES.find((t) => t.value === v) || EVENT_TYPES[4]; }

function uid() { return Math.random().toString(36).slice(2, 10); }

// Réessaie une fois après un court délai en cas d'échec (glitch réseau transitoire)
async function withRetry(fn) {
  const first = await fn();
  if (!first.error) return first;
  await new Promise((r) => setTimeout(r, 800));
  return await fn();
}

function normalizeText(s) {
  return (s || "").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/\s+/g, " ").trim();
}
function levenshtein(a, b) {
  if (a === b) return 0;
  const al = a.length, bl = b.length;
  if (al === 0) return bl;
  if (bl === 0) return al;
  let prev = Array(bl + 1).fill(0).map((_, i) => i);
  for (let i = 1; i <= al; i++) {
    const curr = [i];
    for (let j = 1; j <= bl; j++) {
      const cost = a[i - 1] === b[j - 1] ? 0 : 1;
      curr[j] = Math.min(curr[j - 1] + 1, prev[j] + 1, prev[j - 1] + cost);
    }
    prev = curr;
  }
  return prev[bl];
}
function wordMatches(qw, nw) {
  if (!qw) return true;
  if (nw.includes(qw) || qw.includes(nw)) return true;
  const tol = qw.length <= 4 ? 1 : qw.length <= 8 ? 2 : 3;
  return levenshtein(qw, nw) <= tol;
}
function fuzzyNameMatch(query, name) {
  const nq = normalizeText(query), nn = normalizeText(name);
  if (!nq) return false;
  if (nn.includes(nq)) return true;
  const qws = nq.split(" ").filter(Boolean), nws = nn.split(" ").filter(Boolean);
  return qws.every((qw) => nws.some((nw) => wordMatches(qw, nw)));
}
function formatDateFr(iso) {
  if (!iso) return "";
  const d = new Date(iso + "T00:00:00");
  if (isNaN(d.getTime())) return iso;
  return d.toLocaleDateString("fr-FR", { weekday: "long", day: "numeric", month: "long", year: "numeric" });
}
function isPastDeadline(iso, time) {
  if (!iso) return false;
  const t = time && /^\d{2}:\d{2}$/.test(time) ? time : "23:59";
  return new Date(iso + "T" + t + ":00").getTime() < Date.now();
}
function formatDeadlineFr(iso, time) {
  if (!iso) return "";
  const datePart = formatDateFr(iso);
  const t = time && /^\d{2}:\d{2}$/.test(time) ? time : null;
  return t ? `${datePart} à ${t}` : datePart;
}

/* ---------------------------- UI de base ---------------------------- */
const colors = {
  bg: "#F3ECE0", card: "#FFFDF9", border: "#E4D4B8", borderStrong: "#CBB894",
  gold: "#B08D57", navy: "#1F2A44", text: "#5B5346", muted: "#8A7F6A",
  danger: "#9A3B3B", success: "#2E5B3E",
};
const serif = "'Cormorant Garamond', serif";
const bodyFont = "'EB Garamond', serif";

function useCountdown(targetTime) {
  const [remaining, setRemaining] = useState(() => (targetTime ? targetTime - Date.now() : null));
  useEffect(() => {
    if (!targetTime) return;
    const id = setInterval(() => setRemaining(targetTime - Date.now()), 1000);
    return () => clearInterval(id);
  }, [targetTime]);
  return remaining;
}

function CountdownBlock({ label, targetTime }) {
  const remaining = useCountdown(targetTime);
  if (!targetTime || remaining === null) return null;
  if (remaining <= 0) {
    return (
      <div style={{ textAlign: "center", margin: "16px 0" }}>
        <p style={{ fontFamily: bodyFont, fontSize: 12, letterSpacing: "0.08em", color: colors.gold, marginBottom: 4 }}>{label}</p>
        <p style={{ fontFamily: serif, fontSize: 20, color: colors.navy, fontStyle: "italic" }}>Le jour est arrivé</p>
      </div>
    );
  }
  const totalSeconds = Math.floor(remaining / 1000);
  const days = Math.floor(totalSeconds / 86400);
  const hours = Math.floor((totalSeconds % 86400) / 3600);
  const minutes = Math.floor((totalSeconds % 3600) / 60);
  const seconds = totalSeconds % 60;
  const unit = (value, word) => (
    <div style={{ textAlign: "center", minWidth: 52 }}>
      <p style={{ fontFamily: serif, fontSize: 26, color: colors.navy, margin: 0, lineHeight: 1 }}>{String(value).padStart(2, "0")}</p>
      <p style={{ fontFamily: bodyFont, fontSize: 10, color: colors.muted, letterSpacing: "0.05em", marginTop: 2 }}>{word}</p>
    </div>
  );
  return (
    <div style={{ textAlign: "center", margin: "16px 0" }}>
      <p style={{ fontFamily: bodyFont, fontSize: 12, letterSpacing: "0.08em", color: colors.gold, marginBottom: 8 }}>{label}</p>
      <div style={{ display: "flex", justifyContent: "center", gap: 14 }}>
        {unit(days, "jours")}
        {unit(hours, "heures")}
        {unit(minutes, "min")}
        {unit(seconds, "sec")}
      </div>
    </div>
  );
}

function Divider() {
  return (
    <div style={{ display: "flex", alignItems: "center", justifyContent: "center", gap: 12, margin: "24px 0" }}>
      <span style={{ width: 40, height: 1, background: colors.gold }} />
      <span style={{ color: colors.gold, fontSize: 10 }}>◆</span>
      <span style={{ width: 40, height: 1, background: colors.gold }} />
    </div>
  );
}
function Frame({ children }) {
  return (
    <div className="fade-in frame-padding" style={{ width: "100%", maxWidth: 440, margin: "0 auto", background: colors.card, border: `1px solid ${colors.gold}`, boxShadow: `0 0 0 5px ${colors.card}, 0 0 0 6px ${colors.border}, 0 20px 45px rgba(31, 42, 68, 0.12)`, padding: "44px 36px" }}>
      {children}
    </div>
  );
}
function Field({ label, children }) {
  return (
    <label style={{ display: "block", marginBottom: 20 }}>
      <span style={{ display: "block", marginBottom: 8, fontFamily: bodyFont, fontSize: 15, color: colors.navy }}>{label}</span>
      {children}
    </label>
  );
}
const inputStyle = { width: "100%", fontFamily: bodyFont, fontSize: 16, padding: "10px 12px", background: "#FAF6F0", border: `1px solid ${colors.borderStrong}`, borderRadius: 2, color: colors.navy, outline: "none", boxSizing: "border-box", transition: "border-color 150ms ease, box-shadow 150ms ease" };
function TextInput(props) { return <input {...props} style={{ ...inputStyle, ...(props.style || {}) }} />; }
function Select(props) { return <select {...props} style={{ ...inputStyle, ...(props.style || {}) }}>{props.children}</select>; }
function Button({ children, onClick, variant = "primary", small, disabled, type = "button" }) {
  const base = { fontFamily: bodyFont, fontSize: small ? 13 : 16, letterSpacing: "0.02em", padding: small ? "6px 14px" : "11px 26px", cursor: disabled ? "default" : "pointer", border: `1px solid ${colors.navy}`, borderRadius: 2, opacity: disabled ? 0.5 : 1, whiteSpace: "nowrap" };
  const variantClass = variant === "primary" ? "btn-primary" : variant === "ghost" ? "btn-ghost" : "btn-danger";
  const styles = variant === "primary" ? { ...base, background: colors.navy, color: "#FAF6F0" }
    : variant === "ghost" ? { ...base, background: "transparent", color: colors.navy, border: `1px solid ${colors.borderStrong}` }
    : { ...base, background: "transparent", color: colors.danger, border: `1px solid ${colors.danger}` };
  return <button type={type} onClick={onClick} disabled={disabled} className={variantClass} style={styles}>{children}</button>;
}
function ErrorText({ children }) {
  if (!children) return null;
  return <p style={{ fontFamily: bodyFont, color: colors.danger, fontSize: 14, marginTop: 4 }}>{children}</p>;
}
function MetricCard({ label, value, accent }) {
  return (
    <div className="card-hover" style={{ background: colors.card, border: `1px solid ${colors.border}`, borderRadius: 3, padding: "16px 18px", flex: "1 1 130px", textAlign: "center", boxShadow: "0 2px 8px rgba(31,42,68,0.04)" }}>
      <p style={{ fontFamily: serif, fontSize: 28, color: accent ? colors.gold : colors.navy, margin: 0, lineHeight: 1 }}>{value}</p>
      <p style={{ fontFamily: bodyFont, fontSize: 12, color: colors.muted, marginTop: 6, letterSpacing: "0.03em" }}>{label}</p>
    </div>
  );
}

/* ============================== GUEST VIEW (public, via ?w=weddingId) ============================== */
function GuestView({ weddingId }) {
  const [wedding, setWedding] = useState(null);
  const [loadingWedding, setLoadingWedding] = useState(true);
  const [query, setQuery] = useState("");
  const [matches, setMatches] = useState(null);
  const [selected, setSelected] = useState(null);
  const [existingRsvp, setExistingRsvp] = useState(null);
  const [loading, setLoading] = useState(false);
  const [attending, setAttending] = useState(null);
  const [count, setCount] = useState(1);
  const [meals, setMeals] = useState([]);
  const [memberNames, setMemberNames] = useState("");
  const [allergies, setAllergies] = useState("");
  const [childrenCount, setChildrenCount] = useState(0);
  const [activityNotes, setActivityNotes] = useState("");
  const [showPractical, setShowPractical] = useState(false);
  const [assignedTable, setAssignedTable] = useState(null);
  const [assignedSeats, setAssignedSeats] = useState([]);
  const [saved, setSaved] = useState(false);
  const [error, setError] = useState("");

  useEffect(() => {
    sb.from("weddings").select("*").eq("id", weddingId).single().then(({ data, error }) => {
      setWedding(data || null);
      setLoadingWedding(false);
    });
  }, [weddingId]);

  if (loadingWedding) return <Frame><p style={{ fontFamily: bodyFont, textAlign: "center", color: colors.text }}>Chargement…</p></Frame>;
  if (!wedding) return <Frame><p style={{ fontFamily: bodyFont, textAlign: "center", color: colors.danger }}>Ce lien d'événement est introuvable.</p></Frame>;

  const isSingleMenu = wedding.meal_mode === "single";
  const mealOptions = wedding.meal_options && wedding.meal_options.length > 0 ? wedding.meal_options : DEFAULT_MEAL_OPTIONS;
  const deadlinePassed = isPastDeadline(wedding.rsvp_deadline, wedding.rsvp_deadline_time);

  const registerNew = async () => {
    if (!query.trim()) return;
    setLoading(true); setError("");
    const { data: created, error: createErr } = await sb.from("invites").insert({ wedding_id: weddingId, name: query.trim(), allotted: 20 }).select().single();
    if (createErr) { setError("Inscription impossible (" + createErr.message + ")."); setLoading(false); return; }
    await choose(created);
    setLoading(false);
  };

  const search = async () => {
    if (!query.trim()) return;
    setLoading(true); setError(""); setMatches(null); setSelected(null);
    const { data, error } = await sb.from("invites").select("*").eq("wedding_id", weddingId);
    if (error) { setError("Impossible de charger la liste des invités."); setLoading(false); return; }
    setMatches((data || []).filter((i) => fuzzyNameMatch(query, i.name)));
    setLoading(false);
  };

  const choose = async (invite) => {
    setSelected(invite); setLoading(true);
    const { data } = await sb.from("rsvps").select("*").eq("invite_id", invite.id).maybeSingle();
    let hasExisting = false;
    if (data) {
      hasExisting = true;
      setExistingRsvp(data);
      setAttending(data.attending);
      setCount(data.guest_count || 1);
      setMeals(data.meals || []);
      setMemberNames(data.member_names || "");
      setAllergies(data.allergies || "");
      setChildrenCount(data.children_count || 0);
      setActivityNotes(data.activity_notes || "");
    } else {
      setExistingRsvp(null);
      setAttending(null); setCount(1);
      setMeals([isSingleMenu ? wedding.single_menu : mealOptions[0]]);
      setMemberNames("");
      setAllergies(""); setChildrenCount(0); setActivityNotes("");
    }
    if (invite.table_id) {
      const { data: tableData } = await sb.from("seating_tables").select("*").eq("id", invite.table_id).maybeSingle();
      setAssignedTable(tableData || null);
      const seats = tableData && tableData.seat_assignments ? tableData.seat_assignments[invite.id] || [] : [];
      setAssignedSeats(seats);
    } else {
      setAssignedTable(null);
      setAssignedSeats([]);
    }
    setSaved(hasExisting && data.attending !== null);
    setLoading(false);
  };

  const updateCount = (n) => {
    const capped = wedding.open_mode ? Math.max(1, n) : Math.min(Math.max(1, n), selected.allotted);
    setCount(capped);
    setMeals((prev) => {
      const next = [...prev];
      const fill = isSingleMenu ? wedding.single_menu : mealOptions[0];
      while (next.length < capped) next.push(fill);
      return next.slice(0, capped);
    });
    if (childrenCount > capped) setChildrenCount(capped);
  };

  const submit = async () => {
    if (attending === null || !selected) return;
    setLoading(true); setError("");
    const resolvedMeals = isSingleMenu ? Array(count).fill(wedding.single_menu || "Menu unique") : meals;
    const payload = {
      invite_id: selected.id, attending, guest_count: attending ? count : 0, meals: attending ? resolvedMeals : [],
      member_names: attending ? memberNames.trim() : "", allergies: attending ? allergies.trim() : "",
      children_count: attending ? Number(childrenCount) || 0 : 0, activity_notes: attending ? activityNotes.trim() : "",
      submitted_at: new Date().toISOString(),
    };
    const { error } = await withRetry(() => sb.from("rsvps").upsert(payload, { onConflict: "invite_id" }));
    if (error) {
      setError("Un problème de connexion empêche l'enregistrement pour le moment. Vérifiez votre connexion internet et réessayez dans quelques instants.");
    } else {
      if (wedding.open_mode && attending) {
        await sb.from("invites").update({ allotted: count }).eq("id", selected.id);
      }
      setMeals(resolvedMeals);
      setSaved(true);
    }
    setLoading(false);
  };

  return (
    <Frame>
      {wedding.announced && wedding.couple_names && (
        <div style={{ textAlign: "center", marginBottom: 8 }}>
          <p style={{ fontFamily: bodyFont, fontSize: 13, letterSpacing: "0.08em", color: colors.gold }}>{eventTypeInfo(wedding.event_type).eyebrow}</p>
          <h2 style={{ fontFamily: serif, fontStyle: "italic", fontSize: 30, color: colors.navy, lineHeight: 1.2 }}>{wedding.couple_names}</h2>
          {wedding.wedding_date && <p style={{ fontFamily: bodyFont, fontSize: 15, color: colors.text }}>{wedding.wedding_date}</p>}
          {wedding.message && <p style={{ fontFamily: bodyFont, fontSize: 14, fontStyle: "italic", color: colors.text, marginTop: 8 }}>{wedding.message}</p>}
          {(wedding.venue_name || wedding.address) && (
            <p style={{ fontFamily: bodyFont, fontSize: 14, color: colors.text, marginTop: 8 }}>
              {wedding.venue_name}{wedding.venue_name && wedding.address ? " — " : ""}{wedding.address}
            </p>
          )}
          {wedding.wedding_date_iso && (
            <CountdownBlock label="Jour J dans" targetTime={new Date(wedding.wedding_date_iso + "T00:00:00").getTime()} />
          )}
          {wedding.rsvp_deadline && !isPastDeadline(wedding.rsvp_deadline, wedding.rsvp_deadline_time) && (
            <CountdownBlock label="Temps restant pour répondre" targetTime={new Date(wedding.rsvp_deadline + "T" + (wedding.rsvp_deadline_time || "23:59") + ":00").getTime()} />
          )}
          {wedding.rsvp_deadline && (
            <p style={{ fontFamily: bodyFont, fontSize: 13, color: isPastDeadline(wedding.rsvp_deadline, wedding.rsvp_deadline_time) ? colors.danger : colors.gold, marginTop: 12 }}>
              {isPastDeadline(wedding.rsvp_deadline, wedding.rsvp_deadline_time) ? "La date limite de réponse est dépassée — merci de nous contacter directement." : `Merci de répondre avant le ${formatDeadlineFr(wedding.rsvp_deadline, wedding.rsvp_deadline_time)}`}
            </p>
          )}
          <Divider />
        </div>
      )}

      <h1 style={{ fontFamily: serif, fontSize: 32, color: colors.navy, textAlign: "center", margin: 0 }}>Confirmez votre présence</h1>
      <p style={{ fontFamily: bodyFont, fontSize: 15, color: colors.text, textAlign: "center", marginTop: 8 }}>Retrouvez votre nom pour répondre à notre invitation</p>
      <Divider />

      {!selected && deadlinePassed && (
        <p style={{ fontFamily: bodyFont, color: colors.danger, fontSize: 15, textAlign: "center" }}>
          La date limite de réponse est dépassée. Merci de contacter directement les organisateurs.
        </p>
      )}

      {!selected && !deadlinePassed && (
        <React.Fragment>
          <Field label="Votre nom (ou celui du foyer invité)">
            <TextInput value={query} onChange={(e) => setQuery(e.target.value)} onKeyDown={(e) => e.key === "Enter" && search()} placeholder="Ex. Famille Dubois" />
          </Field>
          <div style={{ textAlign: "center" }}><Button onClick={search} disabled={loading}>{loading ? "Recherche…" : "Rechercher"}</Button></div>
          {error && <ErrorText>{error}</ErrorText>}
          {matches && matches.length === 0 && (
            <div style={{ textAlign: "center", marginTop: 24 }}>
              <p style={{ fontFamily: bodyFont, color: colors.danger, fontSize: 15 }}>
                Aucune invitation ne correspond à ce nom{wedding.open_mode ? "." : " — vérifiez l'orthographe ou contactez les organisateurs."}
              </p>
              {wedding.open_mode && (
                <Button onClick={registerNew} disabled={loading}>{loading ? "…" : `Créer une nouvelle invitation pour "${query.trim()}"`}</Button>
              )}
            </div>
          )}
          {matches && matches.length > 0 && (
            <div style={{ marginTop: 24 }}>
              <p style={{ fontFamily: bodyFont, fontSize: 13, color: colors.muted, marginBottom: 8 }}>Sélectionnez votre nom :</p>
              {matches.map((m) => (
                <button key={m.id} className="clickable-name" onClick={() => choose(m)} style={{ ...inputStyle, display: "block", width: "100%", textAlign: "left", marginBottom: 8, cursor: "pointer", background: colors.card }}>{m.name}</button>
              ))}
              {wedding.open_mode && (
                <button onClick={registerNew} disabled={loading} style={{ fontFamily: bodyFont, fontSize: 13, color: colors.gold, background: "none", border: "none", textDecoration: "underline", cursor: "pointer", marginTop: 8 }}>
                  Aucun de ces noms n'est le mien, créer une nouvelle invitation
                </button>
              )}
            </div>
          )}
        </React.Fragment>
      )}

      {selected && !saved && (
        <div>
          <p style={{ fontFamily: serif, fontSize: 22, color: colors.navy, textAlign: "center" }}>{selected.name}</p>
          {!wedding.open_mode && (
            <p style={{ fontFamily: bodyFont, fontSize: 14, color: colors.text, textAlign: "center", marginBottom: 24 }}>
              {selected.allotted} place{selected.allotted > 1 ? "s" : ""} vous {selected.allotted > 1 ? "sont réservées" : "est réservée"}
            </p>
          )}
          <Field label="Serez-vous présent(e) ?">
            <div style={{ display: "flex", gap: 12 }}>
              <Button variant={attending === true ? "primary" : "ghost"} onClick={() => setAttending(true)}>J'y serai</Button>
              <Button variant={attending === false ? "danger" : "ghost"} onClick={() => setAttending(false)}>Je ne pourrai pas venir</Button>
            </div>
          </Field>
          {attending === true && (
            <React.Fragment>
              <Field label="Nombre de personnes présentes">
                {wedding.open_mode ? (
                  <TextInput type="number" min={1} max={30} value={count} onChange={(e) => updateCount(Math.max(1, Number(e.target.value) || 1))} />
                ) : (
                  <Select value={count} onChange={(e) => updateCount(Number(e.target.value))}>
                    {Array.from({ length: selected.allotted }, (_, i) => i + 1).map((n) => <option key={n} value={n}>{n}</option>)}
                  </Select>
                )}
              </Field>
              {isSingleMenu ? (
                <div style={{ fontFamily: bodyFont, fontSize: 14, color: colors.text, background: "#FAF6F0", border: `1px solid ${colors.border}`, padding: "10px 12px", marginBottom: 20 }}>
                  Menu prévu : {wedding.single_menu || "à préciser par les mariés"}
                </div>
              ) : (
                Array.from({ length: count }).map((_, idx) => (
                  <Field key={idx} label={`Choix du repas — personne ${idx + 1}`}>
                    <Select value={meals[idx] || mealOptions[0]} onChange={(e) => { const next = [...meals]; next[idx] = e.target.value; setMeals(next); }}>
                      {mealOptions.map((opt) => <option key={opt} value={opt}>{opt}</option>)}
                    </Select>
                  </Field>
                ))
              )}
              <Field label="Qui vient exactement ? (facultatif)">
                <TextInput value={memberNames} onChange={(e) => setMemberNames(e.target.value)} placeholder="Ex. Richard, Sophie, Léo" />
              </Field>
              <Field label="Allergies ou régime particulier (facultatif)">
                <TextInput value={allergies} onChange={(e) => setAllergies(e.target.value)} placeholder="Ex. allergie aux fruits à coque, sans gluten" />
              </Field>
              <Field label="Dont nombre d'enfants">
                <TextInput type="number" min={0} max={count} value={childrenCount} onChange={(e) => setChildrenCount(Math.max(0, Math.min(count, Number(e.target.value) || 0)))} />
              </Field>
              {childrenCount > 0 && (
                <Field label="Besoin d'une activité/animation pour les enfants ? (facultatif)">
                  <TextInput value={activityNotes} onChange={(e) => setActivityNotes(e.target.value)} placeholder="Ex. garde d'enfants souhaitée, coin jeux" />
                </Field>
              )}
            </React.Fragment>
          )}
          <ErrorText>{error}</ErrorText>
          <div style={{ display: "flex", justifyContent: "center", gap: 12, marginTop: 24 }}>
            <Button variant="ghost" onClick={() => setSelected(null)}>Retour</Button>
            <Button onClick={submit} disabled={attending === null || loading}>{loading ? "Envoi…" : "Confirmer ma réponse"}</Button>
          </div>
        </div>
      )}

      {selected && saved && !showPractical && (
        <div style={{ textAlign: "center" }}>
          <p style={{ fontFamily: serif, fontSize: 26, color: colors.navy }}>{attending ? "Merci pour votre réponse" : "Nous sommes désolés de votre absence"}</p>
          {attending && (
            <React.Fragment>
              <Divider />
              {assignedTable ? (
                <p style={{ fontFamily: bodyFont, fontSize: 16, color: colors.navy }}>
                  {assignedTable.name}
                  {assignedSeats.length > 0 && ` — chaise${assignedSeats.length > 1 ? "s" : ""} ${assignedSeats.join(", ")}`}
                </p>
              ) : (
                <p style={{ fontFamily: bodyFont, fontSize: 16, color: colors.navy }}>Votre table vous sera communiquée prochainement</p>
              )}
              <p style={{ fontFamily: bodyFont, fontSize: 14, color: colors.text }}>{count} personne{count > 1 ? "s" : ""} attendue{count > 1 ? "s" : ""}</p>
              {memberNames && <p style={{ fontFamily: bodyFont, fontSize: 13, color: colors.muted, fontStyle: "italic" }}>{memberNames}</p>}
              <ul style={{ listStyle: "none", padding: 0, marginTop: 12 }}>
                {meals.map((m, i) => <li key={i} style={{ fontFamily: bodyFont, fontSize: 14, color: colors.text }}>Personne {i + 1} — {m}</li>)}
              </ul>
              {(wedding.parking_info || wedding.transport_info || wedding.hotel_info || wedding.address || wedding.venue_name) && (
                <div style={{ marginTop: 20 }}>
                  <Button onClick={() => setShowPractical(true)}>Infos pratiques (parking, transport, hôtel)</Button>
                </div>
              )}
            </React.Fragment>
          )}
          <div style={{ marginTop: 24 }}><Button variant="ghost" onClick={() => setSelected(null)}>Modifier ma réponse</Button></div>
        </div>
      )}

      {selected && saved && showPractical && (
        <div>
          <h2 style={{ fontFamily: serif, fontSize: 26, color: colors.navy, textAlign: "center", margin: 0 }}>Infos pratiques</h2>
          <Divider />
          {(wedding.parking_info || wedding.address || wedding.venue_name) && (
            <div style={{ marginBottom: 20 }}>
              <p style={{ fontFamily: bodyFont, fontSize: 13, letterSpacing: "0.05em", color: colors.gold, marginBottom: 4 }}>PARKING</p>
              {wedding.parking_info && <p style={{ fontFamily: bodyFont, fontSize: 15, color: colors.text }}>{wedding.parking_info}</p>}
              {(wedding.address || wedding.venue_name) && (
                <a
                  href={`https://www.google.com/maps/search/?api=1&query=${encodeURIComponent("parking " + (wedding.address || wedding.venue_name))}`}
                  target="_blank" rel="noopener noreferrer"
                  style={{ fontFamily: bodyFont, fontSize: 14, color: colors.gold, textDecoration: "underline" }}
                >
                  Voir les parkings à proximité sur Google Maps
                </a>
              )}
            </div>
          )}
          {wedding.transport_info && (
            <div style={{ marginBottom: 20 }}>
              <p style={{ fontFamily: bodyFont, fontSize: 13, letterSpacing: "0.05em", color: colors.gold, marginBottom: 4 }}>TRANSPORT</p>
              <p style={{ fontFamily: bodyFont, fontSize: 15, color: colors.text }}>{wedding.transport_info}</p>
            </div>
          )}
          {wedding.hotel_info && (
            <div style={{ marginBottom: 20 }}>
              <p style={{ fontFamily: bodyFont, fontSize: 13, letterSpacing: "0.05em", color: colors.gold, marginBottom: 4 }}>HÔTELS À PROXIMITÉ</p>
              <p style={{ fontFamily: bodyFont, fontSize: 15, color: colors.text }}>{wedding.hotel_info}</p>
            </div>
          )}
          <div style={{ textAlign: "center", marginTop: 12 }}>
            <Button variant="ghost" onClick={() => setShowPractical(false)}>← Retour à la confirmation</Button>
          </div>
        </div>
      )}
    </Frame>
  );
}

/* ============================== AUTH (organisateur) ============================== */
function authErrorFr(msg) {
  const m = (msg || "").toLowerCase();
  if (m.includes("invalid login credentials")) return "E-mail ou mot de passe incorrect.";
  if (m.includes("already registered") || m.includes("already been registered")) return "Un compte existe déjà avec cet e-mail. Utilisez l'onglet « Connexion ».";
  if (m.includes("email not confirmed")) return "Votre e-mail n'est pas encore confirmé. Cliquez sur le lien reçu par e-mail.";
  if (m.includes("password should be at least")) return "Le mot de passe est trop court (8 caractères minimum).";
  if (m.includes("rate limit") || m.includes("too many")) return "Trop de tentatives. Patientez quelques minutes puis réessayez.";
  if (m.includes("invalid email") || m.includes("unable to validate email")) return "Cette adresse e-mail n'est pas valide.";
  return "Une erreur est survenue : " + msg;
}

function AuthView({ onLoggedIn }) {
  const [mode, setMode] = useState("login"); // login | signup
  const [email, setEmail] = useState("");
  const [password, setPassword] = useState("");
  const [confirm, setConfirm] = useState("");
  const [error, setError] = useState("");
  const [info, setInfo] = useState("");
  const [loading, setLoading] = useState(false);

  const switchMode = (next) => {
    if (next === mode) return;
    setMode(next); setError(""); setInfo(""); setPassword(""); setConfirm("");
  };

  const submit = async (e) => {
    if (e) e.preventDefault();
    setError(""); setInfo("");
    if (!email.trim()) { setError("Saisissez votre adresse e-mail."); return; }
    if (mode === "signup") {
      if (password.length < 8) { setError("Choisissez un mot de passe d'au moins 8 caractères."); return; }
      if (password !== confirm) { setError("Les deux mots de passe ne sont pas identiques."); return; }
    }
    setLoading(true);
    if (mode === "signup") {
      const { data, error } = await sb.auth.signUp({ email: email.trim(), password });
      if (error) setError(authErrorFr(error.message));
      else if (data.user && !data.session) {
        setMode("login"); setPassword(""); setConfirm("");
        setInfo("Compte créé ! Un e-mail de confirmation vient de vous être envoyé. Cliquez sur le lien qu'il contient, puis connectez-vous ici.");
      } else onLoggedIn();
    } else {
      const { error } = await sb.auth.signInWithPassword({ email: email.trim(), password });
      if (error) setError(authErrorFr(error.message));
      else onLoggedIn();
    }
    setLoading(false);
  };

  const isSignup = mode === "signup";
  const tab = (value, label) => {
    const active = mode === value;
    return (
      <button
        type="button"
        role="tab"
        aria-selected={active}
        onClick={() => switchMode(value)}
        style={{ flex: 1, fontFamily: bodyFont, fontSize: 16, padding: "11px 8px", cursor: "pointer", border: "none", borderBottom: `3px solid ${active ? colors.gold : "transparent"}`, background: active ? colors.card : "transparent", color: active ? colors.navy : colors.muted, fontWeight: active ? 600 : 400, transition: "color 150ms ease, border-color 150ms ease" }}
      >
        {label}
      </button>
    );
  };

  return (
    <Frame>
      <h2 style={{ fontFamily: serif, fontSize: 28, color: colors.navy, textAlign: "center", margin: 0 }}>Espace organisateurs</h2>
      <div role="tablist" style={{ display: "flex", margin: "20px 0 22px", borderBottom: `1px solid ${colors.border}` }}>
        {tab("login", "Connexion")}
        {tab("signup", "Créer un compte")}
      </div>
      <p style={{ fontFamily: serif, fontSize: 22, color: colors.navy, textAlign: "center", margin: "0 0 4px" }}>
        {isSignup ? "Créez votre espace" : "Bon retour"}
      </p>
      <p style={{ fontFamily: bodyFont, fontSize: 14, color: colors.text, textAlign: "center", margin: "0 0 22px" }}>
        {isSignup ? "Gratuit pour votre premier événement, sans carte bancaire." : "Connectez-vous pour retrouver vos événements."}
      </p>
      <form onSubmit={submit} noValidate>
        <Field label="Adresse e-mail">
          <TextInput type="email" autoComplete="email" value={email} onChange={(e) => setEmail(e.target.value)} />
        </Field>
        <Field label={isSignup ? "Choisir un mot de passe (8 caractères minimum)" : "Mot de passe"}>
          <TextInput type="password" autoComplete={isSignup ? "new-password" : "current-password"} value={password} onChange={(e) => setPassword(e.target.value)} />
        </Field>
        {isSignup && (
          <Field label="Confirmer le mot de passe">
            <TextInput type="password" autoComplete="new-password" value={confirm} onChange={(e) => setConfirm(e.target.value)} />
          </Field>
        )}
        {error && <ErrorText>{error}</ErrorText>}
        {info && <p style={{ fontFamily: bodyFont, color: colors.success, fontSize: 14, marginTop: 4 }}>{info}</p>}
        <div style={{ textAlign: "center", marginTop: 16 }}>
          <Button type="submit" disabled={loading}>{loading ? "Un instant…" : isSignup ? "Créer mon compte" : "Se connecter"}</Button>
        </div>
      </form>
      <div style={{ textAlign: "center", marginTop: 18 }}>
        <button type="button" onClick={() => switchMode(isSignup ? "login" : "signup")} style={{ fontFamily: bodyFont, fontSize: 13, color: colors.muted, background: "none", border: "none", textDecoration: "underline", cursor: "pointer" }}>
          {isSignup ? "Vous avez déjà un compte ? Connectez-vous" : "Pas encore de compte ? Créez-en un"}
        </button>
      </div>
    </Frame>
  );
}

/* ============================== SEATING PLAN ============================== */
function SeatingPlan({ weddingId, invites, rsvps, refreshInvites }) {
  const [tables, setTables] = useState([]);
  const [loading, setLoading] = useState(true);
  const [selectedPartyId, setSelectedPartyId] = useState(null);
  const [errorTableId, setErrorTableId] = useState(null);
  const [newTableName, setNewTableName] = useState("");
  const [newTableCap, setNewTableCap] = useState(8);
  const errorTimeout = useRef(null);

  const refresh = useCallback(async () => {
    setLoading(true);
    const { data } = await sb.from("seating_tables").select("*").eq("wedding_id", weddingId);
    setTables(data || []);
    setLoading(false);
  }, [weddingId]);

  useEffect(() => { refresh(); }, [refresh]);

  const flashError = (tableId) => {
    setErrorTableId(tableId);
    if (errorTimeout.current) clearTimeout(errorTimeout.current);
    errorTimeout.current = setTimeout(() => setErrorTableId(null), 500);
  };

  const parties = invites
    .filter((inv) => rsvps[inv.id] && rsvps[inv.id].attending)
    .map((inv) => ({ id: inv.id, name: inv.name, size: rsvps[inv.id].guest_count, tableId: inv.table_id || null, memberNames: rsvps[inv.id].member_names || "" }));
  const unassigned = parties.filter((p) => !p.tableId);

  const addTable = async () => {
    if (!newTableName.trim()) return;
    await sb.from("seating_tables").insert({ wedding_id: weddingId, name: newTableName.trim(), capacity: Number(newTableCap) || 1 });
    setNewTableName(""); setNewTableCap(8);
    refresh();
  };

  const removeTable = async (tableId) => {
    await sb.from("invites").update({ table_id: null }).eq("table_id", tableId);
    await sb.from("seating_tables").delete().eq("id", tableId);
    refreshInvites(); refresh();
  };

  const assignSelected = async (tableId) => {
    if (!selectedPartyId) return;
    const party = parties.find((p) => p.id === selectedPartyId);
    const table = tables.find((t) => t.id === tableId);
    if (!party || !table) return;
    const used = parties.filter((p) => p.tableId === tableId).reduce((s, p) => s + p.size, 0);
    if (used + party.size > table.capacity) { flashError(tableId); return; }
    const currentSeats = table.seat_assignments || {};
    const occupied = new Set(Object.values(currentSeats).flat());
    const freeSeats = [];
    for (let n = 1; n <= table.capacity && freeSeats.length < party.size; n++) {
      if (!occupied.has(n)) freeSeats.push(n);
    }
    const nextSeats = { ...currentSeats, [party.id]: freeSeats };
    await sb.from("invites").update({ table_id: tableId }).eq("id", party.id);
    await sb.from("seating_tables").update({ seat_assignments: nextSeats }).eq("id", tableId);
    setSelectedPartyId(null);
    refreshInvites();
    refresh();
  };

  const unassignParty = async (party) => {
    await sb.from("invites").update({ table_id: null }).eq("id", party.id);
    if (party.tableId) {
      const table = tables.find((t) => t.id === party.tableId);
      if (table) {
        const nextSeats = { ...(table.seat_assignments || {}) };
        delete nextSeats[party.id];
        await sb.from("seating_tables").update({ seat_assignments: nextSeats }).eq("id", table.id);
      }
    }
    refreshInvites();
    refresh();
  };

  // Découpe "Richard, Sophie, Léo" en noms individuels pour étiqueter chaque chaise
  const seatLabel = (party, seatIndexWithinParty) => {
    if (party.memberNames) {
      const names = party.memberNames.split(",").map((n) => n.trim()).filter(Boolean);
      if (names.length === party.size && names[seatIndexWithinParty]) return names[seatIndexWithinParty];
    }
    return party.size > 1 ? `${party.name} (${seatIndexWithinParty + 1}/${party.size})` : party.name;
  };

  const [autoAssigning, setAutoAssigning] = useState(false);
  const [autoAssignMsg, setAutoAssignMsg] = useState("");

  const autoAssignAlphabetical = async () => {
    setAutoAssigning(true); setAutoAssignMsg("");
    const sortedUnassigned = [...unassigned].sort((a, b) => a.name.localeCompare(b.name, "fr"));
    const tablesState = tables.map((t) => ({ ...t, seat_assignments: { ...(t.seat_assignments || {}) } }));
    const changedTableIds = new Set();
    let placedCount = 0;
    let skippedCount = 0;

    for (const party of sortedUnassigned) {
      let placed = false;
      for (const t of tablesState) {
        const occupied = Object.values(t.seat_assignments).flat();
        const remaining = t.capacity - occupied.length;
        if (remaining >= party.size) {
          const occSet = new Set(occupied);
          const freeSeats = [];
          for (let n = 1; n <= t.capacity && freeSeats.length < party.size; n++) {
            if (!occSet.has(n)) freeSeats.push(n);
          }
          t.seat_assignments[party.id] = freeSeats;
          changedTableIds.add(t.id);
          await sb.from("invites").update({ table_id: t.id }).eq("id", party.id);
          placedCount++;
          placed = true;
          break;
        }
      }
      if (!placed) skippedCount++;
    }

    for (const tid of changedTableIds) {
      const t = tablesState.find((x) => x.id === tid);
      await sb.from("seating_tables").update({ seat_assignments: t.seat_assignments }).eq("id", tid);
    }

    setAutoAssignMsg(
      placedCount === 0
        ? "Aucun foyer n'a pu être placé (tables pleines ou trop petites)."
        : `${placedCount} foyer(s) placé(s) automatiquement.` + (skippedCount > 0 ? ` ${skippedCount} n'ont pas trouvé de table assez grande.` : "")
    );
    setAutoAssigning(false);
    refreshInvites();
    refresh();
  };

  const totalGuests = parties.reduce((s, p) => s + p.size, 0);
  const seatedGuests = parties.filter((p) => p.tableId).reduce((s, p) => s + p.size, 0);
  const totalCapacity = tables.reduce((s, t) => s + t.capacity, 0);

  return (
    <div style={{ background: colors.card, border: `1px solid ${colors.border}`, borderRadius: 3, boxShadow: "0 2px 10px rgba(31,42,68,0.05)", padding: 22, marginBottom: 24 }}>
      <p style={{ fontFamily: bodyFont, fontSize: 15, color: colors.navy, marginBottom: 4 }}>Plan de table</p>
      <p style={{ fontFamily: bodyFont, fontSize: 13, color: colors.text, marginBottom: 16 }}>Les foyers confirmés apparaissent automatiquement. Sélectionnez-en un puis cliquez sur une table.</p>
      <div style={{ display: "flex", gap: 12, flexWrap: "wrap", marginBottom: 16 }}>
        <MetricCard label="À placer" value={totalGuests} />
        <MetricCard label="Placés" value={seatedGuests} accent />
        <MetricCard label="Capacité totale" value={totalCapacity} />
      </div>
      {tables.length > 0 && unassigned.length > 0 && (
        <div style={{ marginBottom: 16 }}>
          <Button variant="ghost" small onClick={autoAssignAlphabetical} disabled={autoAssigning}>
            {autoAssigning ? "Placement en cours…" : "Placement automatique (ordre alphabétique)"}
          </Button>
          {autoAssignMsg && <p style={{ fontFamily: bodyFont, fontSize: 12, color: colors.text, marginTop: 6 }}>{autoAssignMsg}</p>}
        </div>
      )}
      <div style={{ background: "#FAF6F0", border: `1px solid ${colors.border}`, padding: 14, marginBottom: 16 }}>
        <p style={{ fontFamily: bodyFont, fontSize: 13, color: colors.navy, marginBottom: 8 }}>À placer</p>
        <div style={{ display: "flex", flexWrap: "wrap", gap: 8, minHeight: 28 }}>
          {loading ? <span style={{ fontFamily: bodyFont, fontSize: 13, color: colors.muted }}>Chargement…</span>
            : unassigned.length === 0 ? <span style={{ fontFamily: bodyFont, fontSize: 13, color: colors.muted, fontStyle: "italic" }}>Tout le monde est placé.</span>
            : unassigned.map((p) => (
              <div key={p.id} title={p.memberNames || undefined} onClick={() => setSelectedPartyId(selectedPartyId === p.id ? null : p.id)} style={{ fontFamily: bodyFont, fontSize: 13, padding: "5px 10px", background: selectedPartyId === p.id ? colors.navy : colors.card, color: selectedPartyId === p.id ? "#FAF6F0" : colors.navy, border: `1px solid ${selectedPartyId === p.id ? colors.navy : colors.borderStrong}`, cursor: "pointer" }}>
                {p.name} ({p.size})
              </div>
            ))}
        </div>
      </div>
      <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fill, minmax(200px, 1fr))", gap: 12, marginBottom: 16 }}>
        {tables.map((t) => {
          const seated = parties.filter((p) => p.tableId === t.id);
          const used = seated.reduce((s, p) => s + p.size, 0);
          const full = used >= t.capacity;
          return (
            <div key={t.id} onClick={() => selectedPartyId && !full && assignSelected(t.id)} style={{ background: colors.card, border: `1px solid ${errorTableId === t.id ? colors.danger : full ? colors.gold : colors.border}`, borderRadius: 3, padding: 14, cursor: selectedPartyId && !full ? "pointer" : "default", position: "relative", boxShadow: "0 2px 8px rgba(31,42,68,0.04)" }}>
              <div style={{ display: "flex", justifyContent: "space-between", marginBottom: 8 }}>
                <span style={{ fontFamily: serif, fontSize: 17, color: colors.navy }}>{t.name}</span>
                <span style={{ fontFamily: bodyFont, fontSize: 12, color: full ? colors.gold : colors.muted }}>{used}/{t.capacity}</span>
              </div>
              <div style={{ display: "flex", flexWrap: "wrap", gap: 4, minHeight: 24 }}>
                {seated.length === 0 && <span style={{ fontFamily: bodyFont, fontSize: 12, color: colors.muted, fontStyle: "italic" }}>Vide</span>}
                {Array.from({ length: t.capacity }, (_, i) => i + 1).map((seatNum) => {
                  const seats = t.seat_assignments || {};
                  const occupantId = Object.keys(seats).find((pid) => (seats[pid] || []).includes(seatNum));
                  const occupant = occupantId ? seated.find((p) => p.id === occupantId) : null;
                  const seatIndexWithinParty = occupant ? (seats[occupant.id] || []).indexOf(seatNum) : -1;
                  return (
                    <span
                      key={seatNum}
                      title={occupant ? seatLabel(occupant, seatIndexWithinParty) : "Chaise libre"}
                      onClick={occupant ? (e) => { e.stopPropagation(); unassignParty(occupant); } : undefined}
                      style={{
                        fontFamily: bodyFont, fontSize: 10, width: 22, height: 22, display: "flex", alignItems: "center", justifyContent: "center",
                        background: occupant ? "#FAF6F0" : "transparent", border: `1px solid ${occupant ? colors.borderStrong : colors.border}`,
                        borderRadius: "50%", color: occupant ? colors.navy : colors.muted, cursor: occupant ? "pointer" : "default",
                      }}
                    >
                      {seatNum}
                    </span>
                  );
                })}
              </div>
              {seated.length > 0 && (
                <ul style={{ listStyle: "none", padding: 0, marginTop: 8, marginBottom: 0 }}>
                  {Array.from({ length: t.capacity }, (_, i) => i + 1).map((seatNum) => {
                    const seats = t.seat_assignments || {};
                    const occupantId = Object.keys(seats).find((pid) => (seats[pid] || []).includes(seatNum));
                    if (!occupantId) return null;
                    const occupant = seated.find((p) => p.id === occupantId);
                    if (!occupant) return null;
                    const idx = (seats[occupant.id] || []).indexOf(seatNum);
                    return (
                      <li key={seatNum} style={{ fontFamily: bodyFont, fontSize: 11, color: colors.text }}>
                        Chaise {seatNum} — {seatLabel(occupant, idx)}
                      </li>
                    );
                  })}
                </ul>
              )}
              <button onClick={(e) => { e.stopPropagation(); removeTable(t.id); }} style={{ position: "absolute", top: 6, right: 8, background: "none", border: "none", color: colors.muted, fontSize: 12, cursor: "pointer" }}>✕</button>
            </div>
          );
        })}
      </div>
      <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
        <TextInput value={newTableName} onChange={(e) => setNewTableName(e.target.value)} placeholder="Ex. Table 1" style={{ flex: "1 1 160px" }} onKeyDown={(e) => e.key === "Enter" && addTable()} />
        <TextInput type="number" min={1} value={newTableCap} onChange={(e) => setNewTableCap(e.target.value)} style={{ width: 90 }} />
        <Button small onClick={addTable}>Ajouter une table</Button>
      </div>
    </div>
  );
}

/* ============================== ADMIN DASHBOARD ============================== */
function AdminDashboard({ weddingId, currentUser, onLogout, onBack }) {
  const [wedding, setWedding] = useState(null);
  const [invites, setInvites] = useState([]);
  const [rsvps, setRsvps] = useState({});
  const [loading, setLoading] = useState(true);
  const [name, setName] = useState("");
  const [allotted, setAllotted] = useState(2);
  const [bulkText, setBulkText] = useState("");
  const [showBulk, setShowBulk] = useState(false);
  const [bulkStatus, setBulkStatus] = useState("");
  const [error, setError] = useState("");
  const [savingInfo, setSavingInfo] = useState(false);
  const [infoSaved, setInfoSaved] = useState(false);
  const [editingMeals, setEditingMeals] = useState(false);
  const [mealEdits, setMealEdits] = useState({});
  const [collaborators, setCollaborators] = useState([]);
  const [newCollabEmail, setNewCollabEmail] = useState("");
  const [collabError, setCollabError] = useState("");

  const isOwner = wedding && currentUser && wedding.organizer_id === currentUser.id;

  const refreshCollaborators = useCallback(async () => {
    const { data } = await sb.from("wedding_collaborators").select("*").eq("wedding_id", weddingId);
    setCollaborators(data || []);
  }, [weddingId]);

  const addCollaborator = async () => {
    if (!newCollabEmail.trim()) return;
    setCollabError("");
    const { error } = await sb.from("wedding_collaborators").insert({ wedding_id: weddingId, email: newCollabEmail.trim().toLowerCase() });
    if (error) { setCollabError("Impossible d'ajouter cet accès (" + error.message + ")."); return; }
    setNewCollabEmail("");
    refreshCollaborators();
  };

  const removeCollaborator = async (id) => {
    await sb.from("wedding_collaborators").delete().eq("id", id);
    refreshCollaborators();
  };

  const refresh = useCallback(async () => {
    setLoading(true);
    const { data: w } = await sb.from("weddings").select("*").eq("id", weddingId).single();
    setWedding(w);
    const { data: inv } = await sb.from("invites").select("*").eq("wedding_id", weddingId);
    setInvites(inv || []);
    if (inv && inv.length > 0) {
      const { data: rs } = await sb.from("rsvps").select("*").in("invite_id", inv.map((i) => i.id));
      const map = {};
      (rs || []).forEach((r) => { map[r.invite_id] = r; });
      setRsvps(map);
    } else {
      setRsvps({});
    }
    setLoading(false);
  }, [weddingId]);

  useEffect(() => { refresh(); refreshCollaborators(); }, []); // eslint-disable-line

  const updateWeddingField = (field, value) => {
    setInfoSaved(false);
    setWedding((prev) => ({ ...prev, [field]: value }));
  };

  const currentMealOptions = wedding && wedding.meal_options && wedding.meal_options.length > 0 ? wedding.meal_options : DEFAULT_MEAL_OPTIONS;

  const updateMealOption = (idx, value) => {
    setInfoSaved(false);
    setWedding((prev) => {
      const next = [...(prev.meal_options && prev.meal_options.length > 0 ? prev.meal_options : DEFAULT_MEAL_OPTIONS)];
      next[idx] = value;
      return { ...prev, meal_options: next };
    });
  };
  const addMealOption = () => {
    setInfoSaved(false);
    setWedding((prev) => {
      const next = [...(prev.meal_options && prev.meal_options.length > 0 ? prev.meal_options : DEFAULT_MEAL_OPTIONS)];
      next.push("Nouveau plat");
      return { ...prev, meal_options: next };
    });
  };
  const removeMealOption = (idx) => {
    setInfoSaved(false);
    setWedding((prev) => {
      const next = [...(prev.meal_options && prev.meal_options.length > 0 ? prev.meal_options : DEFAULT_MEAL_OPTIONS)];
      next.splice(idx, 1);
      return { ...prev, meal_options: next.length > 0 ? next : DEFAULT_MEAL_OPTIONS };
    });
  };

  const saveWedding = async () => {
    setSavingInfo(true); setError("");
    const payload = {
      couple_names: wedding.couple_names, wedding_date: wedding.wedding_date, wedding_date_iso: wedding.wedding_date_iso || null, venue_name: wedding.venue_name,
      address: wedding.address, message: wedding.message, rsvp_deadline: wedding.rsvp_deadline || null,
      rsvp_deadline_time: wedding.rsvp_deadline_time || "23:59", open_mode: !!wedding.open_mode,
      event_type: wedding.event_type || "autre",
      announced: true, meal_mode: wedding.meal_mode, meal_options: wedding.meal_options, single_menu: wedding.single_menu,
      meal_overrides: wedding.meal_overrides || {},
      parking_info: wedding.parking_info || "", transport_info: wedding.transport_info || "", hotel_info: wedding.hotel_info || "",
    };
    const { error } = await sb.from("weddings").update(payload).eq("id", wedding.id);
    if (error) setError("Échec de l'enregistrement (" + error.message + ").");
    else setInfoSaved(true);
    setSavingInfo(false);
  };

  const addInvite = async () => {
    if (!name.trim()) return;
    const { error } = await sb.from("invites").insert({ wedding_id: wedding.id, name: name.trim(), allotted: Number(allotted) });
    if (error) { setError("L'ajout n'a pas pu être enregistré."); return; }
    setName(""); setAllotted(2);
    refresh();
  };

  const importBulkInvites = async () => {
    const lines = bulkText.split("\n").map((l) => l.trim()).filter(Boolean);
    const rows = [];
    lines.forEach((line) => {
      const parts = line.split(",");
      const n = (parts[0] || "").trim();
      const a = parts[1] ? parseInt(parts[1].trim(), 10) : 1;
      if (n) rows.push({ wedding_id: wedding.id, name: n, allotted: isNaN(a) || a < 1 ? 1 : a });
    });
    if (rows.length === 0) return;
    setBulkStatus("Import en cours…");
    const { error } = await sb.from("invites").insert(rows);
    if (error) {
      setBulkStatus("Échec de l'import (" + error.message + ").");
    } else {
      setBulkStatus(rows.length + " invitation(s) ajoutée(s).");
      setBulkText("");
      setShowBulk(false);
      refresh();
    }
  };

  const removeInvite = async (id) => {
    await sb.from("invites").delete().eq("id", id);
    refresh();
  };

  const confirmedCount = invites.reduce((s, inv) => { const r = rsvps[inv.id]; return s + (r && r.attending ? r.guest_count : 0); }, 0);

  const exportCsv = () => {
    const escape = (v) => `"${String(v == null ? "" : v).replace(/"/g, '""')}"`;
    const rows = [
      ["Foyer", "Nombre attribué", "Statut", "Nombre confirmé", "Table", "Noms des personnes", "Repas", "Allergies", "Enfants", "Activité enfants"],
    ];
    invites.forEach((inv) => {
      const r = rsvps[inv.id];
      const tableName = inv.table_id ? "Assignée" : "";
      rows.push([
        inv.name,
        inv.allotted,
        r ? (r.attending ? "Présent" : "Absent") : "En attente",
        r && r.attending ? r.guest_count : "",
        tableName,
        r ? r.member_names || "" : "",
        r ? (r.meals || []).join(" / ") : "",
        r ? r.allergies || "" : "",
        r ? r.children_count || 0 : "",
        r ? r.activity_notes || "" : "",
      ]);
    });
    const csvContent = rows.map((row) => row.map(escape).join(",")).join("\n");
    const blob = new Blob(["\uFEFF" + csvContent], { type: "text/csv;charset=utf-8;" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = `invites-${(wedding.couple_names || "evenement").replace(/[^a-z0-9]+/gi, "-")}.csv`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  };

  const presentAlphabetical = invites
    .filter((inv) => rsvps[inv.id] && rsvps[inv.id].attending)
    .slice()
    .sort((a, b) => a.name.localeCompare(b.name, "fr"));

  const mealSummary = (() => {
    const counts = {};
    invites.forEach((inv) => {
      const r = rsvps[inv.id];
      if (!r || !r.attending) return;
      (r.meals || []).forEach((m) => { counts[m] = (counts[m] || 0) + 1; });
    });
    const overrides = (wedding && wedding.meal_overrides) || {};
    Object.keys(overrides).forEach((label) => { if (!(label in counts)) counts[label] = 0; });
    return Object.entries(counts).map(([label, calc]) => ({ label, count: overrides[label] !== undefined ? overrides[label] : calc, isOverridden: overrides[label] !== undefined && overrides[label] !== calc }));
  })();

  const startEditMeals = () => {
    const initial = {};
    mealSummary.forEach((m) => { initial[m.label] = String(m.count); });
    setMealEdits(initial);
    setEditingMeals(true);
  };

  const saveMealEdits = async () => {
    const overrides = {};
    Object.entries(mealEdits).forEach(([label, val]) => { const n = Number(val); if (!isNaN(n)) overrides[label] = n; });
    const updated = { ...wedding, meal_overrides: overrides };
    setWedding(updated);
    await sb.from("weddings").update({ meal_overrides: overrides }).eq("id", wedding.id);
    setEditingMeals(false);
  };

  if (loading || !wedding) return <p style={{ fontFamily: bodyFont, textAlign: "center", color: colors.text }}>Chargement…</p>;

  const guestLink = window.location.origin + window.location.pathname + "?w=" + wedding.id;

  return (
    <div style={{ maxWidth: 760, margin: "0 auto" }}>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 12 }}>
        <div>
          <button onClick={onBack} style={{ fontFamily: bodyFont, fontSize: 13, color: colors.gold, background: "none", border: "none", textDecoration: "underline", cursor: "pointer", marginBottom: 4, display: "block" }}>← Retour à mes événements</button>
          <h1 style={{ fontFamily: serif, fontSize: 28, color: colors.navy, margin: 0 }}>Tableau des invités</h1>
        </div>
        <button onClick={onLogout} style={{ fontFamily: bodyFont, fontSize: 13, color: colors.muted, background: "none", border: "none", textDecoration: "underline", cursor: "pointer" }}>Se déconnecter</button>
      </div>

      <div style={{ background: colors.card, border: `1px solid ${colors.border}`, padding: 14, marginBottom: 20 }}>
        <p style={{ fontFamily: bodyFont, fontSize: 13, color: colors.navy, marginBottom: 4 }}>Lien à partager avec vos invités :</p>
        <p style={{ fontFamily: bodyFont, fontSize: 13, color: colors.gold, wordBreak: "break-all" }}>{guestLink}</p>
      </div>

      {isOwner && (
        <div style={{ background: colors.card, border: `1px solid ${colors.border}`, borderRadius: 3, boxShadow: "0 2px 10px rgba(31,42,68,0.05)", padding: 22, marginBottom: 24 }}>
          <p style={{ fontFamily: bodyFont, fontSize: 15, color: colors.navy, marginBottom: 4 }}>Collaborateurs</p>
          <p style={{ fontFamily: bodyFont, fontSize: 13, color: colors.text, marginBottom: 12 }}>
            Donnez accès à cet événement à une autre personne (les organisateurs, par exemple) — elle devra créer un compte avec cet email pour s'y connecter.
          </p>
          {collaborators.map((c) => (
            <div key={c.id} style={{ display: "flex", justifyContent: "space-between", alignItems: "center", padding: "6px 0", borderBottom: `1px solid ${colors.border}` }}>
              <span style={{ fontFamily: bodyFont, fontSize: 14, color: colors.text }}>{c.email}</span>
              <button onClick={() => removeCollaborator(c.id)} style={{ fontFamily: bodyFont, fontSize: 12, color: colors.danger, background: "none", border: "none", textDecoration: "underline", cursor: "pointer" }}>Retirer</button>
            </div>
          ))}
          <div style={{ display: "flex", gap: 8, marginTop: 12 }}>
            <TextInput type="email" value={newCollabEmail} onChange={(e) => setNewCollabEmail(e.target.value)} placeholder="email@exemple.com" style={{ flex: "1 1 200px" }} onKeyDown={(e) => e.key === "Enter" && addCollaborator()} />
            <Button small onClick={addCollaborator}>Inviter</Button>
          </div>
          <ErrorText>{collabError}</ErrorText>
        </div>
      )}

      <div style={{ background: colors.card, border: `1px solid ${colors.border}`, borderRadius: 3, boxShadow: "0 2px 10px rgba(31,42,68,0.05)", padding: 22, marginBottom: 24 }}>
        <p style={{ fontFamily: bodyFont, fontSize: 15, color: colors.navy, marginBottom: 12 }}>Détails de l'événement &amp; lieu</p>
        <div style={{ display: "flex", flexWrap: "wrap", gap: 12 }}>
          <div style={{ flex: "1 1 200px" }}>
            <Field label="Type d'événement">
              <Select value={wedding.event_type || "autre"} onChange={(e) => updateWeddingField("event_type", e.target.value)}>
                {EVENT_TYPES.map((t) => <option key={t.value} value={t.value}>{t.label}</option>)}
              </Select>
            </Field>
          </div>
          <div style={{ flex: "1 1 220px" }}><Field label="Titre de l'événement"><TextInput value={wedding.couple_names || ""} onChange={(e) => updateWeddingField("couple_names", e.target.value)} placeholder="Ex. Camille & Antoine, Anniversaire de Julie, Soirée Capgemini" /></Field></div>
          <div style={{ flex: "1 1 160px" }}><Field label="Date (texte affiché)"><TextInput value={wedding.wedding_date || ""} onChange={(e) => updateWeddingField("wedding_date", e.target.value)} placeholder="Samedi 12 juin 2027" /></Field></div>
          <div style={{ flex: "1 1 160px" }}><Field label="Date réelle (pour le compte à rebours)"><TextInput type="date" value={wedding.wedding_date_iso || ""} onChange={(e) => updateWeddingField("wedding_date_iso", e.target.value)} /></Field></div>
          <div style={{ flex: "1 1 220px" }}><Field label="Nom de la salle"><TextInput value={wedding.venue_name || ""} onChange={(e) => updateWeddingField("venue_name", e.target.value)} /></Field></div>
          <div style={{ flex: "1 1 260px" }}><Field label="Adresse"><TextInput value={wedding.address || ""} onChange={(e) => updateWeddingField("address", e.target.value)} /></Field></div>
          <div style={{ flex: "1 1 100%" }}><Field label="Petit mot aux invités"><TextInput value={wedding.message || ""} onChange={(e) => updateWeddingField("message", e.target.value)} /></Field></div>
          <div style={{ flex: "1 1 160px" }}><Field label="Date limite de réponse"><TextInput type="date" value={wedding.rsvp_deadline || ""} onChange={(e) => updateWeddingField("rsvp_deadline", e.target.value)} /></Field></div>
          <div style={{ flex: "1 1 120px" }}><Field label="Heure limite"><TextInput type="time" value={wedding.rsvp_deadline_time || "23:59"} onChange={(e) => updateWeddingField("rsvp_deadline_time", e.target.value)} /></Field></div>
        </div>
        <div style={{ display: "flex", alignItems: "center", gap: 12 }}>
          <Button onClick={saveWedding} disabled={savingInfo}>{savingInfo ? "Enregistrement…" : "Enregistrer et annoncer"}</Button>
          {infoSaved && <span style={{ fontFamily: bodyFont, fontSize: 13, color: colors.success }}>Enregistré.</span>}
        </div>
        <ErrorText>{error}</ErrorText>
      </div>

      <div style={{ background: colors.card, border: `1px solid ${colors.border}`, borderRadius: 3, boxShadow: "0 2px 10px rgba(31,42,68,0.05)", padding: 22, marginBottom: 24 }}>
        <p style={{ fontFamily: bodyFont, fontSize: 15, color: colors.navy, marginBottom: 8 }}>Mode de réponse</p>
        <p style={{ fontFamily: bodyFont, fontSize: 13, color: colors.text, marginBottom: 16 }}>
          Pour un grand nombre d'invités, laissez chacun s'inscrire lui-même plutôt que de préparer la liste à l'avance.
        </p>
        <div style={{ display: "flex", gap: 12 }}>
          <Button variant={!wedding.open_mode ? "primary" : "ghost"} onClick={() => updateWeddingField("open_mode", false)}>Liste préparée par vous</Button>
          <Button variant={wedding.open_mode ? "primary" : "ghost"} onClick={() => updateWeddingField("open_mode", true)}>Les invités s'inscrivent eux-mêmes</Button>
        </div>
        <div style={{ display: "flex", alignItems: "center", gap: 12, marginTop: 16 }}>
          <Button onClick={saveWedding} disabled={savingInfo}>{savingInfo ? "Enregistrement…" : "Enregistrer"}</Button>
        </div>
      </div>

      <div style={{ background: colors.card, border: `1px solid ${colors.border}`, borderRadius: 3, boxShadow: "0 2px 10px rgba(31,42,68,0.05)", padding: 22, marginBottom: 24 }}>
        <p style={{ fontFamily: bodyFont, fontSize: 15, color: colors.navy, marginBottom: 8 }}>Infos pratiques</p>
        <p style={{ fontFamily: bodyFont, fontSize: 13, color: colors.text, marginBottom: 16 }}>
          Affichées à l'invité juste après sa confirmation de présence.
        </p>
        <Field label="Parking à proximité"><TextInput value={wedding.parking_info || ""} onChange={(e) => updateWeddingField("parking_info", e.target.value)} placeholder="Ex. Parking gratuit sur place, 200 places" /></Field>
        <Field label="Transport"><TextInput value={wedding.transport_info || ""} onChange={(e) => updateWeddingField("transport_info", e.target.value)} placeholder="Ex. Navette au départ de la gare à 17h" /></Field>
        <Field label="Hôtels à proximité"><TextInput value={wedding.hotel_info || ""} onChange={(e) => updateWeddingField("hotel_info", e.target.value)} placeholder="Ex. Hôtel du Parc, à 5 min — code partenaire EVENT10" /></Field>
        <div style={{ display: "flex", alignItems: "center", gap: 12, marginTop: 8 }}>
          <Button onClick={saveWedding} disabled={savingInfo}>{savingInfo ? "Enregistrement…" : "Enregistrer"}</Button>
        </div>
      </div>

      <div style={{ background: colors.card, border: `1px solid ${colors.border}`, borderRadius: 3, boxShadow: "0 2px 10px rgba(31,42,68,0.05)", padding: 22, marginBottom: 24 }}>
        <p style={{ fontFamily: bodyFont, fontSize: 15, color: colors.navy, marginBottom: 12 }}>Configuration des repas</p>
        <div style={{ display: "flex", gap: 12, marginBottom: 16 }}>
          <Button variant={wedding.meal_mode !== "single" ? "primary" : "ghost"} onClick={() => updateWeddingField("meal_mode", "choice")}>Plusieurs plats au choix</Button>
          <Button variant={wedding.meal_mode === "single" ? "primary" : "ghost"} onClick={() => updateWeddingField("meal_mode", "single")}>Menu unique</Button>
        </div>
        {wedding.meal_mode === "single" ? (
          <Field label="Menu proposé"><TextInput value={wedding.single_menu || ""} onChange={(e) => updateWeddingField("single_menu", e.target.value)} /></Field>
        ) : (
          <React.Fragment>
            {currentMealOptions.map((opt, idx) => (
              <div key={idx} style={{ display: "flex", gap: 8, marginBottom: 8, alignItems: "center" }}>
                <TextInput value={opt} onChange={(e) => updateMealOption(idx, e.target.value)} />
                <Button variant="danger" onClick={() => removeMealOption(idx)}>✕</Button>
              </div>
            ))}
            <Button variant="ghost" onClick={addMealOption}>+ Ajouter un plat</Button>
          </React.Fragment>
        )}
        <div style={{ display: "flex", alignItems: "center", gap: 12, marginTop: 16 }}>
          <Button onClick={saveWedding} disabled={savingInfo}>{savingInfo ? "Enregistrement…" : "Enregistrer"}</Button>
        </div>
      </div>

      <div style={{ background: colors.card, border: `1px solid ${colors.border}`, borderRadius: 3, boxShadow: "0 2px 10px rgba(31,42,68,0.05)", padding: 22, marginBottom: 24 }}>
        <p style={{ fontFamily: bodyFont, fontSize: 15, color: colors.navy, marginBottom: 12 }}>Ajouter une invitation</p>
        <div style={{ display: "flex", flexWrap: "wrap", gap: 12, alignItems: "flex-end" }}>
          <div style={{ flex: "1 1 180px" }}><Field label="Nom du foyer"><TextInput value={name} onChange={(e) => setName(e.target.value)} /></Field></div>
          <div style={{ width: 130 }}><Field label="Nombre attribué"><TextInput type="number" min={1} value={allotted} onChange={(e) => setAllotted(e.target.value)} /></Field></div>
          <div style={{ marginBottom: 20 }}><Button onClick={addInvite}>Ajouter</Button></div>
        </div>
        <button onClick={() => setShowBulk((v) => !v)} style={{ fontFamily: bodyFont, fontSize: 12, color: colors.gold, background: "none", border: "none", textDecoration: "underline", cursor: "pointer", padding: 0 }}>
          {showBulk ? "Fermer l'import groupé" : "Importer plusieurs foyers d'un coup (utile pour une longue liste)"}
        </button>
        {showBulk && (
          <div style={{ marginTop: 12 }}>
            <p style={{ fontFamily: bodyFont, fontSize: 13, color: colors.text, marginBottom: 8 }}>
              Un foyer par ligne, au format <em>Nom, nombre de places</em> :
            </p>
            <textarea
              value={bulkText}
              onChange={(e) => setBulkText(e.target.value)}
              placeholder={"Famille Dubois, 4\nCamille et Théo, 2\nJean Martin, 1"}
              rows={6}
              style={{ ...inputStyle, width: "100%", resize: "vertical", marginBottom: 8 }}
            />
            <Button onClick={importBulkInvites}>Importer</Button>
            {bulkStatus && <p style={{ fontFamily: bodyFont, fontSize: 13, color: colors.success, marginTop: 8 }}>{bulkStatus}</p>}
          </div>
        )}
      </div>

      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", flexWrap: "wrap", gap: 8, marginBottom: 12 }}>
        <p style={{ fontFamily: bodyFont, fontSize: 15, color: colors.navy, margin: 0 }}>
          {confirmedCount} convive(s) confirmé(s) sur {invites.reduce((s, i) => s + i.allotted, 0)} places allouées
        </p>
        {invites.length > 0 && (
          <Button variant="ghost" small onClick={exportCsv}>Exporter en CSV</Button>
        )}
      </div>

      {presentAlphabetical.length > 0 && (
        <div style={{ background: colors.card, border: `1px solid ${colors.border}`, borderRadius: 3, boxShadow: "0 2px 10px rgba(31,42,68,0.05)", padding: 22, marginBottom: 24 }}>
          <p style={{ fontFamily: bodyFont, fontSize: 15, color: colors.navy, marginBottom: 12 }}>
            Invités présents (ordre alphabétique)
          </p>
          <div style={{ columns: "2 220px", columnGap: 24 }}>
            {presentAlphabetical.map((inv) => {
              const r = rsvps[inv.id];
              return (
                <p key={inv.id} style={{ fontFamily: bodyFont, fontSize: 14, color: colors.text, margin: "0 0 6px 0", breakInside: "avoid" }}>
                  {inv.name} <span style={{ color: colors.muted }}>({r.guest_count})</span>
                </p>
              );
            })}
          </div>
        </div>
      )}

      {mealSummary.length > 0 && (
        <div style={{ background: colors.card, border: `1px solid ${colors.border}`, padding: "16px 20px", marginBottom: 24 }}>
          <div style={{ display: "flex", justifyContent: "space-between", marginBottom: 8 }}>
            <p style={{ fontFamily: bodyFont, fontSize: 14, color: colors.navy }}>Récapitulatif des repas à transmettre au traiteur</p>
            {!editingMeals && <button onClick={startEditMeals} style={{ fontFamily: bodyFont, fontSize: 13, color: colors.gold, background: "none", border: "none", textDecoration: "underline", cursor: "pointer" }}>Modifier</button>}
          </div>
          {!editingMeals && mealSummary.map((m) => (
            <div key={m.label} style={{ display: "flex", justifyContent: "space-between", fontFamily: bodyFont, fontSize: 14, color: colors.text }}>
              <span>{m.label}{m.isOverridden && <span style={{ color: colors.gold, fontSize: 12 }}> (ajusté)</span>}</span>
              <span style={{ color: colors.navy }}>{m.count}</span>
            </div>
          ))}
          {editingMeals && (
            <React.Fragment>
              {mealSummary.map((m) => (
                <div key={m.label} style={{ display: "flex", justifyContent: "space-between", gap: 8, marginBottom: 8, alignItems: "center" }}>
                  <span style={{ fontFamily: bodyFont, fontSize: 14, color: colors.text }}>{m.label}</span>
                  <TextInput type="number" min={0} style={{ width: 90 }} value={mealEdits[m.label] !== undefined ? mealEdits[m.label] : m.count} onChange={(e) => setMealEdits((prev) => ({ ...prev, [m.label]: e.target.value }))} />
                </div>
              ))}
              <div style={{ display: "flex", gap: 12, marginTop: 8 }}>
                <Button variant="ghost" onClick={() => setEditingMeals(false)}>Annuler</Button>
                <Button onClick={saveMealEdits}>Enregistrer</Button>
              </div>
            </React.Fragment>
          )}
        </div>
      )}

      <div style={{ border: `1px solid ${colors.border}`, marginBottom: 24 }}>
        {invites.length === 0 && <p style={{ fontFamily: bodyFont, color: colors.text, textAlign: "center", padding: 24 }}>Aucune invitation ajoutée.</p>}
        {invites.map((inv) => {
          const r = rsvps[inv.id];
          return (
            <div key={inv.id} style={{ display: "flex", justifyContent: "space-between", alignItems: "center", flexWrap: "wrap", gap: 8, padding: 16, borderBottom: `1px solid ${colors.border}`, fontFamily: bodyFont }}>
              <div>
                <p style={{ color: colors.navy, fontSize: 16, margin: 0 }}>{inv.name}</p>
                <p style={{ color: colors.muted, fontSize: 13, margin: 0 }}>{inv.allotted} place{inv.allotted > 1 ? "s" : ""} attribuée{inv.allotted > 1 ? "s" : ""}</p>
                {r ? (r.attending ? (
                  <React.Fragment>
                    <p style={{ color: colors.success, fontSize: 13, margin: 0 }}>Présent · {r.guest_count} pers. — {(r.meals || []).join(", ")}</p>
                    {r.member_names && <p style={{ color: colors.muted, fontSize: 12, margin: 0, fontStyle: "italic" }}>{r.member_names}</p>}
                    {r.allergies && <p style={{ color: colors.danger, fontSize: 12, margin: 0 }}>⚠ Allergies : {r.allergies}</p>}
                    {r.children_count > 0 && <p style={{ color: colors.muted, fontSize: 12, margin: 0 }}>{r.children_count} enfant{r.children_count > 1 ? "s" : ""}{r.activity_notes ? " — " + r.activity_notes : ""}</p>}
                  </React.Fragment>
                ) : <p style={{ color: colors.danger, fontSize: 13, margin: 0 }}>Absent</p>)
                  : isPastDeadline(wedding.rsvp_deadline, wedding.rsvp_deadline_time) ? <p style={{ color: colors.danger, fontSize: 13, margin: 0 }}>En retard</p> : <p style={{ color: colors.gold, fontSize: 13, margin: 0 }}>En attente</p>}
              </div>
              <Button variant="danger" onClick={() => removeInvite(inv.id)}>Retirer</Button>
            </div>
          );
        })}
      </div>

      <SeatingPlan weddingId={wedding.id} invites={invites} rsvps={rsvps} refreshInvites={refresh} />
    </div>
  );
}
